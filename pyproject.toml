[project]
name = "kwen"
version = "0.1.0"
description = "Native-Korean SFT corpora + Unsloth Qwen3.5 train entry (CPU-safe by default)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tantara" }]
dependencies = []

[project.optional-dependencies]
# Token stats + JSONL tooling. No GPU.
stats = [
    "huggingface-hub>=0.23",
    "tokenizers>=0.19",
]
# Full Unsloth Qwen3.5 SFT. Install later when a GPU is available.
#   uv sync --extra train
train = [
    "kwen[stats]",
    "datasets>=2.14",
    "transformers>=4.51",
    "trl>=0.9",
    "unsloth",
    "unsloth-zoo",
    "torch",
]

[project.scripts]
kwen = "korean_sft.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "huggingface-hub>=0.23",
    "tokenizers>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["korean_sft"]

[tool.uv]
default-groups = ["dev"]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
